[package]
name = "qedl"
version = "0.1.0"
edition = "2021"
description = "Qualcomm 9008 EDL (Sahara + Firehose) tool, native macOS binary, agent-friendly"
license = "GPL-3.0"

[[bin]]
name = "qedl"
path = "src/main.rs"

[dependencies]
rusb = "0.9.4"
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
anyhow = "1.0.89"
# boot 镜像处理(magiskboot 功能):纯 Rust,保持自包含
flate2 = "1.0.34"          # gzip
lz4_flex = "0.11.3"        # lz4 frame
lzma-rs = "0.3.0"          # xz / lzma(纯 rust)
sha1 = "0.10.6"            # boot id
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }  # 解 Magisk apk

[profile.release]
opt-level = 3
lto = true
strip = true
